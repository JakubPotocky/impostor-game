name: impostor
description: "A local multiplayer social deduction party game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  bonsoir: ^5.0.0
  connectivity_plus: ^6.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: assets/icons/flutter_02.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/themes.json
    - assets/web_client/
